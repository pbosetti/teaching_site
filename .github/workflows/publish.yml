on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev libx11-dev pandoc
          
      - name: Install TinyTeX
        shell: bash
        run: |
          quarto install tinytex
      
      - name: Install R Dependencies 
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1
      
      - name: Render (debug)
        shell: bash
        timeout-minutes: 18
        run: |
          quarto render . --log-level debug --log quarto-render.log

      - name: Show render log tail (always, for diagnosing hangs/timeouts)
        if: always()
        shell: bash
        run: |
          echo "--- last 400 lines of quarto-render.log ---"
          tail -n 400 quarto-render.log || echo "(no log file found)"

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v2
        timeout-minutes: 10
        with:
          target: quarto-pub
          render: false
          QUARTO_PUB_AUTH_TOKEN: ${{ secrets.QUARTO_PUB_AUTH_TOKEN }}