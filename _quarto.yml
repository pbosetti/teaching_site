project:
  type: website
  render:
    - "*.qmd"
    - "!_*.qmd"

website:
  title: "Paolo Bosetti"
  site-url: https://pbosetti.github.io
  reader-mode: true
  # google-analytics: "G-KV5S6RSHJ3"
  cookie-consent:
    type: express
    style: simple
    palette: light
  navbar:
    left:
      - text: New site
        href: https://pbosetti.github.io
      - text: "Blog"
        href: https://paolobosetti.quarto.pub/blog/index.html
      - about.qmd
    right:
      - href: https://github.com/pbosetti
        text: "My GitHub"
        icon: github
  page-footer:
    background: light
    border: true
    left: |
      [![](http://mirrors.creativecommons.org/presskit/buttons/88x31/png/by-nc-sa.eu.png){height='30'}](https://creativecommons.org/licenses/by-nc-sa/4.0/)
    right: 
      - icon: github
        href: https://github.com/pbosetti
  repo-url: https://github.com/pbosetti/teaching_site
  repo-actions: [source, issue]
  
html-math-method: mathjax

format:
  html:
    theme: 
      - cerulean
      - styles.scss
    toc: true
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true
    crossrefs-hover: true
    
comments:
  hypothesis: false



